<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#2f6b3a"><title>BalanceU • Student Well-Being</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;--bg:#eef3ec;--paper:#fff;--soft:#f4f8f3;--ink:#1d2b20;--muted:#637366;--line:#dae5d8;--accent:#2f6b3a;--accentInk:#fff;--orange:#bd793a}
:root[data-theme="dark"]{--bg:#111913;--paper:#1a261d;--soft:#223126;--ink:#eef6ed;--muted:#acc0af;--line:#344537;--accent:#91d79b;--accentInk:#152319;--orange:#e8ae72;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}header{padding:22px max(16px,calc((100vw - 1080px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900;font-size:27px;color:var(--accent)}.tag{font-size:12px;color:var(--muted)}.layout{max-width:1080px;margin:0 auto;padding:0 16px 35px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:22px}aside{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:14px;align-self:start;position:sticky;top:12px}.nav{display:block;width:100%;padding:11px 13px;text-align:left;border:0;border-radius:10px;background:none;color:var(--ink);margin:2px 0}.nav.active{background:var(--accent);color:var(--accentInk)}main{min-height:650px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:19px;padding:19px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.metric{background:var(--soft);padding:17px;border-radius:14px}.metric b{display:block;font-size:28px}.metric span,.muted{color:var(--muted);font-size:13px}h1{font-size:27px;margin:3px 0 16px}h2{font-size:17px;margin:0 0 14px}p{line-height:1.5}.button{border:none;background:var(--accent);color:var(--accentInk);padding:10px 16px;border-radius:11px;font-weight:700}.outline{background:var(--soft);color:var(--ink);border:1px solid var(--line)}input,select,textarea{min-width:0;width:100%;padding:10px;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:9px}label{font-size:13px;font-weight:650;display:block;margin:10px 0 5px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.wide{grid-column:1/-1}.item{padding:12px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.item:last-child{border:0}.item small{display:block;color:var(--muted)}.actions{display:flex;gap:7px;flex-wrap:wrap}.tiny{padding:6px 9px;border:1px solid var(--line);border-radius:9px;background:var(--soft);color:var(--ink)}.done{text-decoration:line-through;color:var(--muted)}.pill{padding:5px 9px;border-radius:100px;background:var(--soft);display:inline-block;font-size:12px;color:var(--muted)}.notice{background:var(--soft);border-left:4px solid var(--accent);padding:13px;border-radius:9px}footer{font-size:12px;color:var(--muted);margin:24px 0}a{color:var(--accent)}@media(max-width:700px){.layout{display:block}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}aside{position:static;display:flex;overflow:auto;margin-bottom:15px;gap:5px}.nav{white-space:nowrap;font-size:12px;width:auto}.panel{padding:15px}.form{grid-template-columns:1fr}.wide{grid-column:1}header{padding:17px}}@media(max-width:400px){.grid{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><div><div class="brand">✦ BalanceU</div><div class="tag">Study well. Live well.</div></div><button class="tiny" id="quickTheme">☾ / ☀ Theme</button></header>
<div class="layout"><aside id="nav"></aside><main id="view" aria-live="polite"></main></div>
<script>
(function(){
'use strict';
var sections=[['today','🏡 Today'],['plan','📅 Planner'],['meals','🥗 Meals'],['health','❤️ Health'],['check','😊 Check-in'],['habits','✅ Habits'],['friends','🏆 Friends'],['settings','⚙️ Settings']];
var dateKey=function(d){var x=d||new Date();return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
var today=dateKey(), week=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var defaults={theme:'light',tasks:[],meals:{},checks:{},moves:{},friends:[],goals:{activity:30,mealWindow:60},prefs:{remind:true,notifications:false},hr:null};
var S;try{S=Object.assign({},defaults,JSON.parse(localStorage.getItem('balanceu-preview-v2')||'{}'))}catch(_){S=Object.assign({},defaults)}
S.tasks=Array.isArray(S.tasks)?S.tasks:[];S.friends=Array.isArray(S.friends)?S.friends:[];S.meals=S.meals||{};S.checks=S.checks||{};S.moves=S.moves||{};S.goals=Object.assign({},defaults.goals,S.goals||{});S.prefs=Object.assign({},defaults.prefs,S.prefs||{});
var page='today',day=today,bleDevice=null;
var $=function(x){return document.getElementById(x)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var save=function(){try{localStorage.setItem('balanceu-preview-v2',JSON.stringify(S))}catch(_){alert('Browser storage unavailable. Your changes may not be saved.')}}
var id=function(){return crypto.randomUUID?crypto.randomUUID():'b'+Date.now()+Math.random().toString(36).slice(2)};
var move=function(k){return Number(S.moves[k]||0)};
var getMeals=function(k){if(!S.meals[k])S.meals[k]=[{name:'Breakfast',time:'08:00',actual:''},{name:'Lunch',time:'12:30',actual:''},{name:'Dinner',time:'19:00',actual:''}];return S.meals[k]};
var doneMeals=function(k){return getMeals(k).filter(function(m){return !!m.actual}).length};
var mealScore=function(k){var m=getMeals(k),completed=m.filter(function(x){return x.actual});if(!completed.length)return null;return Math.round(100*completed.filter(function(x){return Math.abs(minutes(x.time)-minutes(x.actual))<=S.goals.mealWindow}).length/completed.length)};
var minutes=function(t){var a=t.split(':').map(Number);return a[0]*60+a[1]};
var check=function(k){return S.checks[k]};
var balance=function(k){var tasks=S.tasks.filter(function(t){return t.date===k}),done=tasks.filter(function(t){return t.done}).length,sl=check(k)&&Number(check(k).sleep||0);return Math.min(100,Math.round(25*(tasks.length?done/tasks.length:0.5)+25*Math.min(1,move(k)/S.goals.activity)+25*doneMeals(k)/3+25*(sl?Math.min(sl/8,1):0.5)))};
var card=function(title,body){return '<section class="panel"><h2>'+title+'</h2>'+body+'</section>'};
var metric=function(n,t){return '<div class="metric"><b>'+esc(n)+'</b><span>'+t+'</span></div>'};
var tasksHTML=function(k){var list=S.tasks.filter(function(t){return t.date===k}).sort(function(a,b){return a.time.localeCompare(b.time)});return list.length?list.map(function(t){return '<div class="item"><div><strong class="'+(t.done?'done':'')+'">'+esc(t.title)+'</strong><small>'+esc(t.time)+' · '+esc(t.category)+'</small></div><div class="actions"><button class="tiny" data-action="task" data-id="'+esc(t.id)+'">'+(t.done?'↩':'✓')+'</button><button class="tiny" data-action="delete" data-id="'+esc(t.id)+'">×</button></div></div>'}).join(''):'<p class="muted">No tasks yet. Add your first plan.</p>'};
var top=function(s){return '<h1>'+s+'</h1>'};
function render(){document.documentElement.dataset.theme=S.theme==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):S.theme;
$('nav').innerHTML=sections.map(function(x){return '<button class="nav '+(page===x[0]?'active':'')+'" data-page="'+x[0]+'">'+x[1]+'</button>'}).join('');
var out='',m=getMeals(day),active=move(today),checkToday=check(today);
if(page==='today'){out=top('Your daily balance')+'<div class="grid">'+metric(balance(today)+'%','Balance score (self-reported)')+metric(active+' min','Movement logged')+metric(doneMeals(today)+'/3','Meals completed')+'</div>'+
card('One step at a time','<p class="notice">'+(active<S.goals.activity?'A little movement can help you reset today. A short walk or stretch counts.':'Your movement goal is logged for today. Remember to recover, too.')+'</p><div class="actions"><button class="button" data-action="move10">+10 active min</button><button class="button outline" data-page="plan">Open planner</button></div>')+
card('Today’s schedule',tasksHTML(today))+
card('Meals & recovery','<p>'+m.map(function(x){return esc(x.name)+' '+esc(x.time)+(x.actual?' ✓':'')}).join(' · ')+'</p><p class="muted">Sleep and recovery are not WHOOP readings unless connected and synced.</p>');
}
if(page==='plan'){out=top('Plan your day')+card('Add a task','<form id="taskForm" class="form"><div class="wide"><label>Task</label><input name="title" maxlength="90" placeholder="Finish programming assignment" required></div><div><label>Date</label><input name="date" type="date" value="'+esc(day)+'" required></div><div><label>Start</label><input name="time" type="time" value="16:00" required></div><div><label>Category</label><select name="category"><option>Study</option><option>Work</option><option>Exercise</option><option>Rest</option><option>Sleep</option><option>Commute</option></select></div><button class="button" type="submit">Add task</button></form>')+card('Schedule for '+esc(day),'<input aria-label="Plan date" id="planDate" type="date" value="'+esc(day)+'">'+tasksHTML(day))+
card('Break reminder','<p class="muted">Schedule short breaks between long study blocks. Browser reminders only operate while this page is open.</p>')}
if(page==='meals'){out=top('Meal planner')+card('Choose your day','<input id="mealDate" type="date" value="'+esc(day)+'"><p class="muted">Plan three meals, then mark your real eating time to measure consistency. Skipped meals are never scored as a moral failure.</p>')+card('Your three meals','<div class="form">'+m.map(function(x,i){return '<div><label>'+esc(x.name)+' planned time</label><input data-mealtime="'+i+'" type="time" value="'+esc(x.time)+'"></div><div><label>Actual time (optional)</label><input data-mealactual="'+i+'" type="time" value="'+esc(x.actual)+'"></div>'}).join('')+'</div><p class="muted">Consistency: '+(mealScore(day)===null?'No meals logged yet':mealScore(day)+'% within '+S.goals.mealWindow+' minutes')+'</p>')+
card('This week',week.map(function(w,i){var d=new Date();var diff=(d.getDay()+6)%7;d.setDate(d.getDate()-diff+i);var k=dateKey(d);return '<span class="pill">'+w+' '+doneMeals(k)+'/3</span> '}).join(''))}
if(page==='health'){out=top('Health & recovery')+'<div class="grid">'+metric(S.hr===null?'—':S.hr+' bpm','Live Bluetooth heart rate')+metric(active+' min','Activity today')+metric('—','WHOOP Recovery / Strain')+'</div>'+
card('WHOOP connection','<p class="muted">Direct BLE heart-rate broadcast is experimental and needs a compatible browser and a broadcasting sensor. This does not calculate proprietary WHOOP recovery/strain. Full WHOOP OAuth needs the separate secure backend and an authorized membership/account.</p><div class="actions"><button class="button" data-action="ble">Connect live HR (BLE)</button><button class="button outline" data-action="bleoff">Disconnect</button></div><p id="bleStatus" class="muted">Not connected.</p>')+
card('Activity journal','<p>Movement today: <b>'+active+' minutes</b> / '+S.goals.activity+'-minute goal</p><div class="actions"><button class="button" data-action="move10">Log 10 min</button><button class="button outline" data-action="move30">Log 30 min</button></div>')+
card('How to use recovery','<p class="muted">BalanceU encourages movement and rest without assigning medical meaning to missing metrics. Only display wearable recovery values when real, authorized WHOOP API data is available.</p>')}
if(page==='check'){out=top('Daily check-in')+card('How are you feeling?','<form id="checkForm"><label>Mood</label><select name="mood">'+['Drained','Low','Okay','Good','Great'].map(function(x,i){return '<option value="'+(i+1)+'" '+(checkToday&&Number(checkToday.mood)===i+1?'selected':'')+'>'+x+'</option>'}).join('')+'</select><label>Stress (1–10)</label><input name="stress" type="number" min="1" max="10" value="'+(checkToday?checkToday.stress:5)+'" required><label>Hours slept</label><input name="sleep" type="number" min="0" max="18" step=".5" value="'+(checkToday?checkToday.sleep:7)+'" required><label>Reflection (private to this browser)</label><textarea name="note" rows="3" maxlength="1000">'+esc(checkToday&&checkToday.note||'')+'</textarea><p><button class="button">Save today’s check-in</button></p></form>')+card('Well-being reflection','<p class="notice">'+(checkToday&&checkToday.stress>=7?'Heavy day? Focus on essentials, take a real break, and reach out to someone you trust.':checkToday?'Thanks for checking in. Your feelings are more than a score.':'Check in regularly to notice patterns without judging yourself.')+'</p>')}
if(page==='habits'){var habits=[['Movement goal',active>=S.goals.activity],['Three meals',doneMeals(today)===3],['Sleep goal',!!checkToday&&Number(checkToday.sleep)>=7],['Daily reflection',!!checkToday]];out=top('Healthy habits')+card('Today’s progress',habits.map(function(x){return '<div class="item"><b>'+esc(x[0])+'</b><span class="pill">'+(x[1]?'✓ Done':'Not yet')+'</span></div>'}).join(''))+card('Your weekly insights','<p class="muted">Consistency over perfection. Recover when you need to; don’t push through illness or exhaustion just to protect a streak.</p>')}
if(page==='friends'){out=top('Friends & peers')+card('Invite a friend','<p class="muted">Local prototype only: adding a friend here does not send a real invite or sync another person’s data. A secure multi-user backend is needed for real rankings.</p><form id="friendForm" class="form"><div><label>Friend’s display name</label><input name="name" maxlength="35" placeholder="Your friend" required></div><div><label>Invite code (demo)</label><input name="code" maxlength="35" placeholder="MUIC123" required></div><button class="button wide">Add to local list</button></form>')+card('Your circle','<div class="item"><strong>You</strong><span class="pill">'+balance(today)+' balance pts</span></div>'+S.friends.map(function(x){return '<div class="item"><strong>'+esc(x.name)+'</strong><span class="pill">Awaiting live connection</span></div>'}).join('')+'<p class="muted">No simulated friend statistics are shown as real data. Future leaderboard scores should be shared only with friends’ consent.</p>')}
if(page==='settings'){out=top('Settings')+card('Appearance','<label>Background theme</label><select id="themeSelect"><option value="light" '+(S.theme==='light'?'selected':'')+'>Light</option><option value="dark" '+(S.theme==='dark'?'selected':'')+'>Dark</option><option value="system" '+(S.theme==='system'?'selected':'')+'>System</option></select>')+card('Personal goals','<label>Movement goal (minutes per day)</label><input id="activityGoal" type="number" min="5" max="180" value="'+S.goals.activity+'"><label>Meal consistency window (minutes)</label><select id="mealWindow">'+[30,60,90,120].map(function(n){return '<option value="'+n+'" '+(S.goals.mealWindow===n?'selected':'')+'>'+n+'</option>'}).join('')+'</select><p><button class="button" data-action="saveGoals">Save preferences</button></p>')+card('Data control','<div class="actions"><button class="button" data-action="export">Export JSON backup</button><button class="button outline" data-action="clear">Reset local data</button></div><p class="muted">This preview stores information in your current browser only. Do not use it as a medical record or assume the data is shared across devices.</p>')}
$('view').innerHTML=out+'<footer>BalanceU student prototype · Not a medical device · Private browser-only storage by default</footer>';
}
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var p=b.dataset.page,a=b.dataset.action;if(p){page=p;render();return}
if(a==='task'){var t=S.tasks.find(function(t){return t.id===b.dataset.id});if(t)t.done=!t.done}
if(a==='delete'){S.tasks=S.tasks.filter(function(t){return t.id!==b.dataset.id})}
if(a==='move10'||a==='move30'){S.moves[today]=move(today)+(a==='move10'?10:30)}
if(a==='saveGoals'){S.goals.activity=Math.max(5,Math.min(180,Number($('activityGoal').value)||30));S.goals.mealWindow=Number($('mealWindow').value)||60}
if(a==='export'){var blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),link=document.createElement('a');link.href=u;link.download='balanceu-backup.json';link.click();setTimeout(function(){URL.revokeObjectURL(u)},1000)}
if(a==='clear'){if(confirm('Delete all locally saved BalanceU preview data?')){localStorage.removeItem('balanceu-preview-v2');location.reload()}return}
if(a==='ble'){connectBLE();return}
if(a==='bleoff'){if(bleDevice&&bleDevice.gatt.connected)bleDevice.gatt.disconnect();S.hr=null}
save();render()});
document.addEventListener('submit',function(e){if(e.target.id==='taskForm'){e.preventDefault();var f=new FormData(e.target);S.tasks.push({id:id(),title:String(f.get('title')).trim(),date:String(f.get('date')),time:String(f.get('time')),category:String(f.get('category')),done:false})}
if(e.target.id==='friendForm'){e.preventDefault();var g=new FormData(e.target);S.friends.push({id:id(),name:String(g.get('name')).trim().slice(0,35),code:String(g.get('code')).trim().slice(0,35)})}
if(e.target.id==='checkForm'){e.preventDefault();var c=new FormData(e.target);S.checks[today]={mood:Number(c.get('mood')),stress:Number(c.get('stress')),sleep:Number(c.get('sleep')),note:String(c.get('note')).slice(0,1000)}}
save();render()});
document.addEventListener('change',function(e){if(e.target.id==='themeSelect'){S.theme=e.target.value}
if(e.target.id==='planDate'||e.target.id==='mealDate'){day=e.target.value;render();return}
if(e.target.hasAttribute('data-mealtime'))getMeals(day)[Number(e.target.dataset.mealtime)].time=e.target.value;
if(e.target.hasAttribute('data-mealactual'))getMeals(day)[Number(e.target.dataset.mealactual)].actual=e.target.value;
save();render()});
$('quickTheme').onclick=function(){S.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';save();render()};
async function connectBLE(){var el=$('bleStatus');try{if(!navigator.bluetooth)throw Error('Web Bluetooth is unavailable here. Try desktop Chrome or Edge over HTTPS.');bleDevice=await navigator.bluetooth.requestDevice({filters:[{services:['heart_rate']}]});var g=await bleDevice.gatt.connect(),s=await g.getPrimaryService('heart_rate'),c=await s.getCharacteristic('heart_rate_measurement');await c.startNotifications();c.addEventListener('characteristicvaluechanged',function(ev){var d=ev.target.value,flags=d.getUint8(0);S.hr=(flags&1)?d.getUint16(1,true):d.getUint8(1);save();if(page==='health')render()});el.textContent='Connected to BLE heart-rate stream.'}catch(err){if(el)el.textContent=err.message}}
render();
})();
</script></body></html>
